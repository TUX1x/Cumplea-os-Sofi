<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para la mejor amiga del mundo, mi vida, mi todo!</title>
    <style>
        /* Estilos básicos para la página */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #ffb6c1);
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
        }
        h1 {
            color: #d14779;
        }
        p {
            color: #70284c;
            font-size: 18px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #d14779;
            color: white;
            border: none;
            border-radius: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #a03a5b;
        }
        #collage {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 900px;
            margin: 30px auto;
        }
        #collage img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }
        #collage img:hover {
            transform: scale(1.05);
        }
        #seccion-carta {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 30px auto;
            box-shadow: 0 4px 15px rgba(209, 106, 139, 0.3);
        }
        #seccion-carta h2 {
            color: #d14779;
            margin-top: 0;
        }
        #seccion-carta p {
            color: #70284c;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-carta {
            background-color: #ff69b4;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 12px;
        }
        .btn-carta:hover {
            background-color: #d14779;
        }
        #globos-container {
            position: fixed;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            overflow: hidden;
        }
        .globo {
            pointer-events: auto;
            position: absolute;
            bottom: 0;
            width: 40px;
            height: 60px;
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
            border-radius: 20px 20px 25px 25px;
            box-shadow: inset -5px -5px 10px rgba(255,255,255,0.7);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            transition: background 0.3s, border 0.3s;
        }
    </style>
</head>
<body>
    <h1>¡Para la mejor amiga del mundo, mi vida, mi todo!</h1>
    <p>¡Feliz cumpleaños corazón te hice esto con mucho amor y cariño solo para ti!</p>

    <!-- COLLAGE DE 19 FOTOS -->
    <div id="collage">
        <img src="imagenes/foto1.jpg" alt="Foto 1">
        <img src="imagenes/foto2.jpg" alt="Foto 2">
        <img src="imagenes/foto3.jpg" alt="Foto 3">
        <img src="imagenes/foto4.jpg" alt="Foto 4">
        <img src="imagenes/foto5.jpg" alt="Foto 5">
        <img src="imagenes/foto6.jpg" alt="Foto 6">
        <img src="imagenes/foto7.jpg" alt="Foto 7">
        <img src="imagenes/foto8.jpg" alt="Foto 8">
        <img src="imagenes/foto9.jpg" alt="Foto 9">
        <img src="imagenes/foto10.jpg" alt="Foto 10">
        <img src="imagenes/foto11.jpg" alt="Foto 11">
        <img src="imagenes/foto12.jpg" alt="Foto 12">
        <img src="imagenes/foto13.jpg" alt="Foto 13">
        <img src="imagenes/foto14.jpg" alt="Foto 14">
        <img src="imagenes/foto15.jpg" alt="Foto 15">
        <img src="imagenes/foto16.jpg" alt="Foto 16">
        <img src="imagenes/foto17.jpg" alt="Foto 17">
        <img src="imagenes/foto18.jpg" alt="Foto 18">
        <img src="imagenes/foto19.jpg" alt="Foto 19">
    </div>

    <!-- SECCIÓN DE CARTA INTERACTIVA -->
    <div id="seccion-carta">
        <h2>💌 Carta para ti</h2>
        <p>Espero la disfrutes proque la verdad la escribi con el corazón en la mano</p>
        <button class="btn-carta" onclick="abrirCarta()">Pulsa aqui</button>
    </div>

    <button onclick="cambiarFondo()">Modo Día/Noche</button>
    <button onclick="explotarGlobos()">Reventar Globos</button>

    <div id="globos-container"></div>

    <script>
        function cambiarFondo() {
            document.body.style.backgroundColor = 
                document.body.style.backgroundColor === 'white' ? 'linear-gradient(135deg, #ffe6f0, #ffb6c1)' : 'white';
        }

        function explotarGlobos() {
            alert('¡Globos explotados! 🎈🎈🎈');
        }

        // >>>>> AQUÍ EDITAS LA RUTA DEL PDF
        // Cambia "carta.pdf" por el nombre de tu archivo PDF
        function abrirCarta() {
            window.open('carta.pdf', '_blank');
            // Si quieres descargarlo en lugar de abrirlo, usa esto en su lugar:
            // const link = document.createElement('a');
            // link.href = 'carta.pdf';
            // link.download = 'Carta para ti.pdf';
            // link.click();
        }

        const globosContainer = document.getElementById('globos-container');

        function crearGlobo() {
            const globo = document.createElement('div');
            globo.classList.add('globo');
            globo.style.left = Math.random() * 100 + 'vw';
            globosContainer.appendChild(globo);

            const animation = globo.animate([
                { transform: 'translateY(0)' },
                { transform: 'translateY(-100vh)' }
            ], {
                duration: 8000 + Math.random() * 4000,
                easing: 'linear'
            });

            animation.onfinish = () => globo.remove();

            globo.addEventListener('click', () => {
                animation.cancel();
                globo.style.background = 'transparent';
                globo.style.border = 'none';
                globo.textContent = '🎉';
                setTimeout(() => globo.remove(), 800);
            });
        }

        setInterval(crearGlobo, 800);
    </script>
</body>
</html>

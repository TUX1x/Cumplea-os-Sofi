<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Libro con páginas editables</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #ffe6f0, #ffb6c1);
    color: #4a0033;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  h1 {
    color: #d14779;
  }
  #libro-container {
    width: 800px;
    height: 500px;
    margin: 20px auto;
    perspective: 2000px;
    position: relative;
  }
  #libro {
    width: 100%;
    height: 100%;
    position: relative;
  }
  .pagina {
    width: 50%;
    height: 100%;
    position: absolute;
    top: 0;
    overflow: hidden;
    background: #ffe6f0;
    box-shadow: inset 0 0 30px rgba(255, 182, 193, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    transition: transform 0.7s ease;
    font-size: 18px;
  }
  .pagina.izquierda {
    left: 0;
    border-right: 6px solid #f4c2d7;
    border-radius: 10px 0 0 10px;
    z-index: 2;
  }
  .pagina.derecha {
    right: 0;
    border-left: 6px solid #f4c2d7;
    border-radius: 0 10px 10px 0;
    text-align: left;
    padding: 20px;
  }
  .pagina img {
    max-width: 90%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }
  #botones {
    margin-top: 20px;
  }
  button {
    background-color: #d14779;
    border: none;
    color: white;
    padding: 12px 25px;
    margin: 0 15px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:disabled {
    background-color: #ffb6c1;
    cursor: default;
  }
  button:hover:not(:disabled) {
    background-color: #a03a5b;
  }
</style>
</head>
<body>

<h1>Libro interactivo para mi mejor amiga</h1>

<div id="libro-container">
  <div id="libro">
    <div class="pagina izquierda" id="paginaIzquierda"></div>
    <div class="pagina derecha" id="paginaDerecha"></div>
  </div>
</div>

<div id="botones">
  <button id="btnAnterior" onclick="paginaAnterior()">Anterior</button>
  <button id="btnSiguiente" onclick="paginaSiguiente()">Siguiente</button>
</div>

<script>
  // >>>>> Aquí editas el mensaje de bienvenida (portada)
  const mensajeInicio = `
    <h2>¡Tu mensaje de bienvenida aquí!</h2>
    <p>Escribe el texto que quieras para la portada del libro.</p>
  `;

  // >>>>> Aquí editas los nombres/rutas de las fotos
  const paginasFotos = [
    "imagenes/foto1.jpg",
    "imagenes/foto2.jpg",
    "imagenes/foto3.jpg"
    // ... agrega o cambia tus fotos aquí
  ];

  // >>>>> Aquí editas el texto de cada página derecha (una por cada foto)
  const paginasTexto = [
    "<h2>Página 1</h2><p>Texto personalizado para la foto 1.</p>",
    "<h2>Página 2</h2><p>Texto personalizado para la foto 2.</p>",
    "<h2>Página 3</h2><p>Texto personalizado para la foto 3.</p>"
    // ... y así sucesivamente
  ];

  let paginaActual = 0;

  const izquierda = document.getElementById('paginaIzquierda');
  const derecha = document.getElementById('paginaDerecha');
  const btnAnterior = document.getElementById('btnAnterior');
  const btnSiguiente = document.getElementById('btnSiguiente');

  let animando = false;

  function setContenido() {
    if(paginaActual === 0){
      izquierda.innerHTML = '';
      derecha.innerHTML = mensajeInicio;
      izquierda.style.transform = 'rotateY(0deg)';
      derecha.style.transform = 'rotateY(0deg)';
    } else {
      izquierda.innerHTML = `<img src="${paginasFotos[paginaActual-1]}" alt="Foto ${paginaActual}">`;
      // >>>>> Aquí se muestra el texto que editaste en el array paginasTexto
      derecha.innerHTML = paginasTexto[paginaActual-1] || "<!-- Aquí pon tu texto -->";
      izquierda.style.transform = 'rotateY(0deg)';
      derecha.style.transform = 'rotateY(0deg)';
    }
  }

  function paginaSiguiente() {
    if(animando || paginaActual >= paginasFotos.length) return;
    animando = true;
    izquierda.style.transition = 'transform 0.8s ease';
    derecha.style.transition = 'transform 0.8s ease';
    izquierda.style.transformOrigin = 'right center';
    izquierda.style.transform = 'rotateY(-180deg)';
    derecha.style.transformOrigin = 'left center';
    derecha.style.transform = 'rotateY(-180deg)';
    setTimeout(() => {
      paginaActual++;
      setContenido();
      izquierda.style.transition = 'none';
      derecha.style.transition = 'none';
      izquierda.style.transform = 'rotateY(180deg)';
      derecha.style.transform = 'rotateY(180deg)';
      void izquierda.offsetWidth;
      izquierda.style.transition = 'transform 0.8s ease';
      derecha.style.transition = 'transform 0.8s ease';
      izquierda.style.transform = 'rotateY(0deg)';
      derecha.style.transform = 'rotateY(0deg)';
      setTimeout(() => {
        animando = false;
        actualizarBotones();
      }, 800);
    }, 800);
  }

  function paginaAnterior() {
    if(animando || paginaActual === 0) return;
    animando = true;
    izquierda.style.transition = 'transform 0.8s ease';
    derecha.style.transition = 'transform 0.8s ease';
    izquierda.style.transformOrigin = 'right center';
    derecha.style.transformOrigin = 'left center';
    izquierda.style.transform = 'rotateY(180deg)';
    derecha.style.transform = 'rotateY(180deg)';
    setTimeout(() => {
      paginaActual--;
      setContenido();
      izquierda.style.transition = 'none';
      derecha.style.transition = 'none';
      izquierda.style.transform = 'rotateY(-180deg)';
      derecha.style.transform = 'rotateY(-180deg)';
      void izquierda.offsetWidth;
      izquierda.style.transition = 'transform 0.8s ease';
      derecha.style.transition = 'transform 0.8s ease';
      izquierda.style.transform = 'rotateY(0deg)';
      derecha.style.transform = 'rotateY(0deg)';
      setTimeout(() => {
        animando = false;
        actualizarBotones();
      }, 800);
    }, 800);
  }

  function actualizarBotones(){
    btnAnterior.disabled = (paginaActual === 0);
    btnSiguiente.disabled = (paginaActual === paginasFotos.length);
  }

  setContenido();
  actualizarBotones();
</script>

</body>
</html>
